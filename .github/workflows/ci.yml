name: Ambler CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  source-and-engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npx expo install --check
      - run: npm run check:source
      - run: npm run test:engine
      - run: npm run typecheck

  android-debug:
    runs-on: ubuntu-latest
    needs: source-and-engine
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: npm install --no-audit --no-fund
      - name: Build Android debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: ambler-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  web-export:
    runs-on: ubuntu-latest
    needs: source-and-engine
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Export Ambler web build
        run: npm run build:web
      - uses: actions/upload-artifact@v4
        with:
          name: ambler-web
          path: dist-web
          if-no-files-found: error

  ui-simulation:
    runs-on: ubuntu-latest
    needs: source-and-engine
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Run deterministic UI audit
        run: npm run test:ui:static
      - name: Install Chromium for UI simulation
        run: npx playwright install --with-deps chromium
      - name: Run Ambler UI simulation
        run: npm run test:ui:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ambler-ui-simulation-report
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
