name: Import Ambler source

on:
  push:
    paths:
      - '.ambler-import/READY'

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout import payload
        uses: actions/checkout@v4

      - name: Reconstruct release candidate
        shell: bash
        run: |
          set -euo pipefail
          cat .ambler-import/chunk-*.b64 | tr -d '\n\r' | base64 --decode > /tmp/ambler.zip
          mkdir -p /tmp/ambler-src
          unzip -q /tmp/ambler.zip -d /tmp/ambler-src
          test -f /tmp/ambler-src/package.json
          test -f /tmp/ambler-src/app.json

      - name: Replace repository with Ambler source
        shell: bash
        run: |
          set -euo pipefail
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a /tmp/ambler-src/. .
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: import Ambler release candidate 3df8ec8"
          git push origin HEAD:main
