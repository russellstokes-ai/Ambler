name: Import Ambler current source

on:
  push:
    branches: [main]
    paths:
      - '.ambler-import/**'

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout import commit
        uses: actions/checkout@v4

      - name: Reconstruct Ambler source
        shell: bash
        run: |
          set -euo pipefail
          tr -d '\n\r ' < .ambler-import/payload.b64 | base64 --decode > /tmp/ambler.tar.xz
          echo "0b940abd1e3a3521e1ca0c527d0babb08b4e6016f4d5ab645fa13385e8650e45  /tmp/ambler.tar.xz" | sha256sum -c -
          mkdir -p /tmp/ambler-src
          tar -xJf /tmp/ambler.tar.xz -C /tmp/ambler-src
          test -f /tmp/ambler-src/package.json
          test -f /tmp/ambler-src/app.json
          test -f /tmp/ambler-src/docs/HANDOFF.md
          test -f /tmp/ambler-src/docs/ROUTE_REPLAY_V2.md

      - name: Replace bootstrap tree with current Ambler source
        shell: bash
        run: |
          set -euo pipefail
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a /tmp/ambler-src/. .
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: import current Ambler source and Route Replay V2"
          git push origin HEAD:main
